<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ElectroSemi Agent</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="chat-header">
      <div class="brand">
        <span class="dot"></span>
        <div>
          <h1>ElectroSemi Agent</h1>
          <p>Conversational electronics sourcing</p>
        </div>
      </div>
      <div class="header-actions">
        <button id="browseBtn" class="btn ghost" type="button">Browse catalog</button>
        <button id="cartBtn" class="btn primary" type="button">
          Cart <span id="cartCount" class="badge">0</span>
        </button>
      </div>
    </header>

    <main id="messages" class="messages" aria-live="polite"></main>

    <footer class="composer">
      <textarea id="input" rows="1" placeholder="Ask about a part, e.g. 'I need STM32 controllers for an industrial project'"></textarea>
      <button id="sendBtn" class="btn primary" type="button">Send</button>
    </footer>
  </div>

  <aside id="cartDrawer" class="drawer" aria-hidden="true">
    <div class="drawer-head">
      <h2>Your cart</h2>
      <button id="cartClose" class="icon-btn" type="button" aria-label="Close cart">×</button>
    </div>
    <div id="cartItems" class="cart-items"></div>
    <div class="cart-summary">
      <div class="total-row"><span>Total</span><span id="cartTotal">$0.00</span></div>
      <form id="cartForm" class="cart-form">
        <input name="name" type="text" placeholder="Your name" required />
        <input name="email" type="email" placeholder="Email" required />
        <input name="company" type="text" placeholder="Company (optional)" />
        <textarea name="notes" rows="2" placeholder="Notes (optional)"></textarea>
        <button type="submit" class="btn primary block">Submit to sales team</button>
        <p id="cartStatus" class="cart-status"></p>
      </form>
    </div>
  </aside>
  <div id="overlay" class="overlay" hidden></div>

  <script src="app.js"></script>
</body>
</html>
