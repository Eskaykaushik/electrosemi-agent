<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0f" />
  <title>ElectroSemi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="chat-header">
      <div class="brand">
        <span class="dot"></span>
        <div>
          <h1>ElectroSemi</h1>
          <p>electronics sourcing</p>
        </div>
      </div>
      <div class="header-actions">
        <button id="browseBtn" class="btn ghost" type="button" aria-label="Browse product catalog">Catalog</button>
        <button id="cartBtn" class="btn primary" type="button" aria-label="Open shopping cart">
          Cart <span id="cartCount" class="badge" aria-live="polite">0</span>
        </button>
      </div>
    </header>

    <main id="messages" class="messages" aria-live="polite" aria-label="Chat messages"></main>

    <div id="scrollIndicator" class="scroll-indicator" hidden>
      <button id="scrollBtn" class="scroll-indicator-btn" type="button" aria-label="Scroll to latest messages">New messages &darr;</button>
    </div>

    <footer class="composer">
      <div class="composer-wrap">
        <textarea id="input" rows="1" placeholder="Ask about a part..." aria-label="Type your message"></textarea>
        <button id="sendBtn" class="btn primary send-btn" type="button" aria-label="Send message">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
    </footer>
  </div>

  <aside id="cartDrawer" class="drawer" aria-hidden="true" aria-label="Shopping cart">
    <div class="drawer-head">
      <h2>Cart</h2>
      <button id="cartClose" class="icon-btn" type="button" aria-label="Close cart">&times;</button>
    </div>
    <div id="cartItems" class="cart-items"></div>
    <div class="cart-summary">
      <div class="total-row"><span>Total</span><span id="cartTotal">$0.00</span></div>
      <form id="cartForm" class="cart-form" novalidate>
        <input name="name" type="text" placeholder="Your name" required aria-label="Your name" />
        <input name="email" type="email" placeholder="Email" required aria-label="Email address" />
        <input name="company" type="text" placeholder="Company (optional)" aria-label="Company name" />
        <textarea name="notes" rows="2" placeholder="Notes (optional)" aria-label="Order notes"></textarea>
        <button type="submit" class="btn primary block">Submit order</button>
        <p id="cartStatus" class="cart-status" aria-live="polite"></p>
      </form>
    </div>
  </aside>
  <div id="overlay" class="overlay" hidden></div>

  <div id="srAnnounce" class="sr-only" aria-live="assertive" role="status"></div>

  <script src="app.js"></script>
</body>
</html>
